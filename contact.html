<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | BrainBoost</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="page-header">

        <nav class="navbar">
            <div class="logo">Brain<span>Boost</span></div>

            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="subjects.html">Subjects</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
        </nav>

        <h1>Contact BrainBoost</h1>
        <p>We would love to hear from you.</p>

    </header>


    <main class="page-content">

        <form class="contact-form" onsubmit="sendMessage(event)">

            <h2>Send Us a Message</h2>

            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message..." required></textarea>

            <button type="submit" class="main-button">
                Send Message
            </button>

        </form>

    </main>


    <footer>

        <div class="logo">Brain<span>Boost</span></div>

        <p>Learn. Practice. Succeed.</p>

        <p class="copyright">
            © 2026 BrainBoost. All rights reserved.
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>s
